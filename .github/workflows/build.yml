name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build TV cursor helper
        continue-on-error: true
        run: gradle :helper:assembleRelease --no-daemon
      - name: Bundle helper into the app
        run: |
          mkdir -p app/src/main/assets
          if [ -f helper/build/outputs/apk/release/helper-release.apk ]; then
            cp helper/build/outputs/apk/release/helper-release.apk app/src/main/assets/tvhelper.apk
            echo "Helper bundled."
          else
            echo "Helper APK not found - the app will build without the on-TV cursor."
          fi
      - name: Build TVDeck release APK
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TVDeck-apk
          path: app/build/outputs/apk/release/app-release.apk
